<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confluence</title>
<meta name="theme-color" content="#0F1A2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#161a22;--mut:#6b7380;--line:#e3e6ec;--up:#168a4a;--dn:#d23a3a;--poc:#2f6fdc;--va:#e48a14;--gold:#e0a800;--pv:#7a828f;--cum:#0f9d8a;--buy:#1f6fe0;--sell:#d65f00;--on-buy:#fff;--on-sell:#fff;--vp:#7b4bd1;--star:#8f3fd1;--dot:#ff9f1c;--wl:#8f3fd1;--cvdl:#7a5a00;--acc:#2f6fdc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1218;--card:#171b23;--ink:#e8ebf1;--mut:#8b93a1;--line:#2a303b;--up:#35c274;--dn:#ef6a6a;--poc:#6ea2ff;--va:#f2a73b;--gold:#f2c230;--pv:#9aa2b0;--cum:#37c9b4;--buy:#5aa2ff;--sell:#ffa24d;--on-buy:#08203f;--on-sell:#2a1500;--vp:#b08cff;--star:#c79bff;--dot:#ffb15c;--wl:#c79bff;--cvdl:#f5d98a;--acc:#6ea2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 8px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}.brand img{width:34px;height:34px;border-radius:9px;flex:none}
.brand h1{font-size:20px;letter-spacing:.01em}.brand .tag{color:var(--mut);font-size:12.5px;font-weight:500}
.install{display:block;margin:8px 0 2px;width:100%;max-width:420px;border:0;border-radius:12px;background:#F6C12E;color:#0F1A2E;font:800 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 14px;box-shadow:0 2px 0 #C9971A;cursor:pointer}
.install[hidden]{display:none}
#installBox .btn{margin-top:8px;border:0;border-radius:10px;background:#F6C12E;color:#0F1A2E;font:700 14px system-ui,sans-serif;padding:10px 14px;cursor:pointer}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--mut);font-size:12.5px}
.tabs{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;padding:0 16px 24px}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:78vh;overflow:auto}
.side .r{display:grid;grid-template-columns:52px 1fr auto;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.side .r:hover,.side .r.on{background:rgba(47,111,220,.1)}
.side .more{display:none;width:100%;border:0;background:transparent;color:var(--acc);font:600 13.5px system-ui,sans-serif;padding:10px;cursor:pointer}
@media(max-width:860px){.side{max-height:none}.side .more{display:block}.side:not(.open) .r:nth-child(n+6):not(.on){display:none}}
.pill{display:inline-block;min-width:22px;text-align:center;border-radius:10px;padding:0 6px;font-size:11.5px;font-weight:600;background:var(--line);color:var(--mut)}
.pill.s2{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mut);color:var(--ink)}.pill.s3{background:var(--ink);color:var(--card)}
.pill.ob{background:transparent;box-shadow:inset 0 0 0 1px var(--mut);color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;padding:10px 12px}
.card h2{font-size:14.5px;margin:0 0 4px}
.tg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:4px 0 6px}
.tg label{display:flex;gap:4px;align-items:center;cursor:pointer}
.chart{display:flex;gap:0;align-items:stretch}
.pos{position:relative;flex:1;min-width:0}.scroll{overflow-x:auto}#dscroll{overflow-x:hidden}
#dprof,#tprof{flex:0 0 124px;width:124px}
.cap span.r{left:auto;right:8px}
@media(max-width:700px){.cap span{white-space:nowrap;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}}
.cap span{position:absolute;left:6px;font-size:10.5px;color:var(--mut);background:var(--card);padding:0 4px;border-radius:3px;pointer-events:none}
svg{display:block;max-width:none}
.axis text,.lbl{fill:var(--mut);font-size:10.5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}
.ok{color:var(--up);font-weight:600}.bad{color:var(--dn)}
.note{background:rgba(224,168,0,.12);border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.sw{display:inline-block;width:12px;height:10px;vertical-align:-1px;margin-right:4px;border-radius:2px}
.hide{display:none}
.tagc{display:inline-block;border-radius:5px;padding:0 6px;font-size:11px;font-weight:700;line-height:16px;border:1.5px solid;vertical-align:1px}
.tagc.buy{border-color:var(--buy)}.tagc.sell{border-color:var(--sell)}
.tagc.buy.solid{background:var(--buy);color:var(--on-buy)}.tagc.sell.solid{background:var(--sell);color:var(--on-sell)}
.tagc.buy.out{color:var(--buy);background:var(--card)}.tagc.sell.out{color:var(--sell);background:var(--card)}
.zb{display:inline-block;width:18px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px;border:1px solid var(--mut)}
.zb.bv{background:color-mix(in srgb,var(--buy) 24%,transparent);border:2px solid var(--buy)}.zb.bn{background:color-mix(in srgb,var(--buy) 8%,transparent);border:1px solid var(--buy)}
.zb.sv{background:color-mix(in srgb,var(--sell) 24%,transparent);border:2px solid var(--sell)}.zb.sn{background:color-mix(in srgb,var(--sell) 8%,transparent);border:1px solid var(--sell)}
.zb.br{background:transparent;border:1px dashed var(--mut)}
.ln{display:inline-block;width:18px;height:0;vertical-align:3px;margin-right:4px;border-top:2px solid}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dot);border:1px solid #000;vertical-align:0;margin-right:4px}
.leg{row-gap:5px}
.starb{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:var(--star);color:#fff;font-size:10px;font-weight:700;border:1.5px solid var(--card);margin-left:-5px;vertical-align:8px}
.symt td{padding:6px 8px;vertical-align:middle}.symt td:first-child{white-space:nowrap}.symt td:last-child{text-align:left;white-space:normal}
h3{font-size:14px;margin:14px 0 6px}
.seg{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}.seg.on{background:var(--acc);border-color:var(--acc);color:#fff}.seg:disabled{opacity:.35;cursor:default}
.info{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0 4px;background:var(--bg);font-size:12.5px;line-height:1.55;min-height:96px}.info .sub{font-size:12px}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="icons/icon-192.png" alt=""><div><h1>Confluence</h1><div class="tag">Order Block × Order Flow × Volume Profile</div></div></div>
  <div class="sub" id="sub"></div>
  <button class="install" type="button" id="installTop" hidden>⬇ Cài app xuống điện thoại</button>
</header>
<div class="tabs"><button class="tab on" data-t="chart">Biểu đồ</button><button class="tab" data-t="res">Kết quả đo</button><button class="tab" data-t="how">Cách đọc</button></div>

<div id="v-chart" class="wrap">
  <div class="side" id="side"></div>
  <div>
    <div class="card"><h2 id="title"></h2><div id="summary" class="sub"></div></div>
    <div class="card">
      <h2>Nến NGÀY · OB · Volume Profile {{VPW}} phiên · Delta</h2>
      <div class="tg">
        <label><input type="checkbox" id="d_ob" checked> Hộp OB</label>
        <label><input type="checkbox" id="d_vp" checked> POC/VAH/VAL</label>
        <label><input type="checkbox" id="d_mk" checked> Cảnh báo MUA/BÁN</label>
        <label><input type="checkbox" id="d_nvp"> cả lần test thiếu POC</label>
        <label><input type="checkbox" id="d_ma" checked> TB20 khối lượng</label>
        <label><input type="checkbox" id="d_br"> Hiện OB đã thủng / đã dùng</label>
      </div>
      <div class="chart"><div class="pos"><div class="scroll" id="dscroll"></div><div class="cap" id="dcap"></div></div><div id="dprof"></div></div>
      <div class="leg" id="dleg"></div>
    </div>
    <div class="card">
      <h2>Nến 15' · vùng OB/VP · VWAP · Delta · CVD · điểm hợp lưu</h2>
      <div class="tg">
        <label><input type="checkbox" id="t_ob" checked> Hộp OB</label>
        <label><input type="checkbox" id="t_vp" checked> Mức VP ngày</label>
        <label><input type="checkbox" id="t_vw" checked> VWAP</label>
        <label><input type="checkbox" id="t_ev" checked> Thẻ MUA/BÁN (≥2/3 điểm)</label>
        <label><input type="checkbox" id="t_dot"> mọi lần chạm vùng (chấm cam)</label>
        <label><input type="checkbox" id="t_dp" checked> Profile từng phiên</label>
        <label><input type="checkbox" id="t_yd"> Mức hôm qua</label>
        <label><input type="checkbox" id="t_cu"> Cộng dồn từng ngày</label>
      </div>
      <div class="tg" id="tctl"><span>Xem:</span><button class="seg" data-n="1">1 ngày</button><button class="seg" data-n="2">2</button><button class="seg" data-n="3">3</button><button class="seg" data-n="5">5</button><button class="seg" data-n="0">Tất cả</button><button class="seg" id="tprev" title="lùi 1 ngày">◀</button><button class="seg" id="tnext" title="tới 1 ngày">▶</button><span class="sub" id="trange"></span></div>
      <div class="chart"><div class="pos"><div class="scroll" id="tscroll"></div><div class="cap" id="tcap"></div></div><div id="tprof"></div></div>
      <div class="info" id="tinfo"></div>
      <div class="leg" id="tleg"></div>
    </div>
  </div>
</div>

<div id="v-res" class="hide" style="padding:0 16px 24px"></div>
<div id="v-how" class="hide" style="padding:0 16px 24px">
  <div class="card" id="installBox"><h2>Cài app xuống điện thoại</h2><div class="sub" id="installState">Đang kiểm tra…</div>
    <button class="btn" type="button" id="installBtn" hidden>Cài app</button></div>
  <div id="how-body"></div>
</div>

<script>
const D = /*__DATA__*/null;
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fx = (x, p = 2) => x == null ? '—' : Number(x).toLocaleString('vi-VN', {minimumFractionDigits: p, maximumFractionDigits: p});
const pc = (x, p = 2) => x == null ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(p) + '%';
function el(tag, at, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in at) e.setAttribute(k, at[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function tip(node, text) { el('title', {}, node, text); }
function lin(d0, d1, r0, r1) { const k = (r1 - r0) / ((d1 - d0) || 1); return v => r0 + (v - d0) * k; }
function ticks(lo, hi, n = 6) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const st = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) out.push(+v.toFixed(6));
  return out;
}
const mm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const sh = d => d.slice(8, 10) + '/' + d.slice(5, 7);
const big = v => v == null ? '—' : (Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(2) + ' tr' : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(0) + ' k' : v);

let SYM = (location.hash || '').slice(1) || null;

/* ---------------------------------------------------------------- khung chung */
function profileCol(host, prof, y, H, lo, hi, title) {
  host.innerHTML = '';
  const W = 124, svg = el('svg', {width: W, height: H}, host);
  const g = el('g', {class: 'axis'}, svg);
  ticks(lo, hi, 6).forEach(v => el('text', {x: W - 2, y: y(v) + 3, 'text-anchor': 'end'}, g, fx(v)));
  if (title) el('text', {x: 2, y: 9, class: 'lbl', style: 'font-weight:600'}, svg, title);
  if (!prof) return;
  const mx = Math.max(...prof.v) || 1, bh = Math.max(2, Math.abs(y(prof.p[0]) - y(prof.p[1])) - 1);
  prof.p.forEach((p, i) => {
    const w = prof.v[i] / mx * 64, inVA = p >= prof.val && p <= prof.vah;
    el('rect', {x: 4, y: y(p) - bh / 2, width: w, height: bh, fill: inVA ? css('--vp') : css('--mut'), opacity: inVA ? .4 : .28}, svg);
  });
  // 17/10/2026: nhãn mức nằm TRONG vùng histogram (căn phải sát mép 68 px, có viền nền), tên trên vạch – giá dưới vạch,
  // để cột số trục bên phải giữ nguyên đủ mọi giá trị; cặp sau đẩy xuống nếu chạm cặp trước
  const lab = [['POC', prof.poc], ['VAH', prof.vah], ['VAL', prof.val]].filter(q => q[1] != null).map(([n, v]) => ({n, v, y: y(v)})).sort((a, b) => a.y - b.y);
  let prev = -99;
  lab.forEach(it => { it.ty = Math.max(it.y - 2, prev + 11); prev = it.ty + 12; });
  lab.forEach(it => {
    const c = css('--vp');
    el('line', {x1: 0, x2: 70, y1: it.y, y2: it.y, stroke: c, 'stroke-width': it.n === 'POC' ? 2 : 1.2, 'stroke-dasharray': it.n === 'POC' ? null : '4 2'}, svg);
    el('text', {x: 68, y: it.ty, 'text-anchor': 'end', class: 'lbl', style: halo() + `fill:${c};font-weight:700`}, svg, it.n);
    el('text', {x: 68, y: it.ty + 12, 'text-anchor': 'end', class: 'lbl', style: halo() + `fill:${c};font-weight:600`}, svg, fx(it.v));
  });
}
function candle(g, x, bw, y, o, h, l, c) {
  const up = c >= o, col = up ? css('--up') : css('--dn');
  el('line', {x1: x, x2: x, y1: y(h), y2: y(l), stroke: col}, g);
  el('rect', {x: x - bw / 2, y: Math.min(y(o), y(c)), width: bw, height: Math.max(1, Math.abs(y(o) - y(c))), fill: col}, g);
}
const halo = () => `paint-order:stroke;stroke:${css('--card')};stroke-width:3px;stroke-linejoin:round;`;
const hexA = (n, a) => { const h = css(n).replace('#', ''); return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; };
// Thẻ tín hiệu: màu theo HƯỚNG (xanh dương = MUA, cam = BÁN); đặc = mạnh, viền rỗng = yếu; mũi nhọn chỉ vào nến.
function tag(g, x, yEdge, up, text, solid, isBuy, fs, tipText, star) {
  const col = css(isBuy ? '--buy' : '--sell'), on = css(isBuy ? '--on-buy' : '--on-sell');
  const w = Math.round(text.length * fs * 0.62 + 12), h = fs + 7, gap = 3, pt = 5;
  const yBody = up ? yEdge + gap + pt : yEdge - gap - pt - h;
  const grp = el('g', {}, g);
  el('path', {d: up ? `M${x},${yEdge + gap} L${x - 4},${yBody + .5} L${x + 4},${yBody + .5}Z` : `M${x},${yEdge - gap} L${x - 4},${yBody + h - .5} L${x + 4},${yBody + h - .5}Z`, fill: col}, grp);
  el('rect', {x: x - w / 2, y: yBody, width: w, height: h, rx: 4, fill: solid ? col : css('--card'), stroke: col, 'stroke-width': 1.5}, grp);
  el('text', {x, y: yBody + h / 2 + fs * .36, 'text-anchor': 'middle', style: `font-size:${fs}px;font-weight:700;fill:${solid ? on : col}`}, grp, text);
  if (star) {                                      // ★ tím: có thêm delta ngày và/hoặc CVD nửa đầu phiên đạt
    el('circle', {cx: x + w / 2, cy: yBody, r: 8, fill: css('--star'), stroke: css('--card'), 'stroke-width': 1.5}, grp);
    el('text', {x: x + w / 2, y: yBody + 3.6, 'text-anchor': 'middle', style: 'font-size:10px;font-weight:700;fill:#fff'}, grp, '★');
  }
  if (tipText) tip(grp, tipText);
  return grp;
}

/* ---------------------------------------------------------------- nến ngày */
function renderDaily() {
  const d = D.sym[SYM].d, bars = d.bars, n = bars.length;
  // Màn hình hẹp (điện thoại, 15/10/2026): cột profile 124 px chiếm 1/3 bề rộng và để trống bên phải các khung KL/Delta/CVD →
  // ẩn cột, vẽ profile thành lớp phủ mờ ở mép phải khung giá (kiểu TradingView), nến + các khung dưới trải hết bề rộng; nới khoảng cách chú thích.
  const narrow = $('#dscroll').closest('.chart').clientWidth < 640;
  $('#dprof').style.display = narrow ? 'none' : '';
  const AX = narrow ? 34 : 0, G = narrow ? 14 : 0;
  const PL = 6, hostW = $('#dscroll').clientWidth || 900, BW = Math.max(6, Math.floor((hostW - PL - 14 - AX) / n)), W = narrow ? hostW : PL + n * BW + 14, hP = 290, top = 10, vTop = 308 + G, vH = 46, dTop = 366 + 2 * G, dH = 70, cTop = dTop + dH + 32 + 2 * G, cH = 110, H = cTop + cH + 22;
  const lo0 = Math.min(...bars.map(b => b[3])), hi0 = Math.max(...bars.map(b => b[2])), pad = (hi0 - lo0) * .05;
  const lo = lo0 - pad, hi = hi0 + pad, y = lin(hi, lo, top, top + hP), x = i => PL + i * BW + BW / 2;
  const host = $('#dscroll'); host.innerHTML = ''; window.__dw = hostW;
  const svg = el('svg', {width: W, height: H}, host);
  const gA = el('g', {class: 'axis'}, svg);
  ticks(lo, hi, 6).forEach(v => { el('line', {x1: 0, x2: W, y1: y(v), y2: y(v), stroke: css('--line')}, svg); });
  const cp = el('clipPath', {id: 'dc'}, svg); el('rect', {x: 0, y: top, width: W, height: hP}, cp);
  const gZ = el('g', {'clip-path': 'url(#dc)'}, svg), gLab = el('g', {'clip-path': 'url(#dc)'});   // gLab gắn vào svg SAU khi vẽ nến → nhãn nằm trên nến
  if ($('#d_ob').checked) d.obs.forEach(o => {
    const gone = o.broken || o.used;                   // đã thủng, hoặc ĐÃ DÙNG (chạm lần đầu rồi bật ra khỏi vùng)
    if (gone && !$('#d_br').checked && !(o.used && o.marked)) return;   // ẩn mặc định; OB đã dùng nhưng có thẻ MUA/BÁN ở phiên test vẫn vẽ để thẻ không treo giữa trống
    const tk = o.bull ? '--buy' : '--sell', col = css(tk);
    const x0 = Math.max(0, x(Math.max(o.k, 0)) - BW / 2), x1 = x(Math.min(o.end, n - 1)) + BW / 2, yt = y(o.hi), hh = Math.max(2, y(o.lo) - y(o.hi));
    const r = el('rect', {x: x0, y: yt, width: Math.max(2, x1 - x0), height: hh,
      fill: gone ? 'none' : hexA(tk, o.valid ? .24 : .08), stroke: gone ? css('--mut') : col,
      'stroke-width': o.valid ? 2 : .8, 'stroke-dasharray': gone ? '3 3' : null}, gZ);
    const nm = `${o.bull ? 'OB tăng' : 'OB giảm'}${o.valid ? ' ✓' : ''} ${fx(o.lo)}–${fx(o.hi)}${o.used ? ' · đã dùng' : ''}`;
    tip(r, nm + ` · imbalance: ${{fvg: 'FVG', vi: 'Volume Imbalance', both: 'FVG + Volume Imbalance'}[o.imb] || '—'}` + `${o.valid ? ' · HỢP LỆ' : ' · thường'}${o.broken ? ' · đã thủng' : ''}${o.used ? ' · ĐÃ DÙNG (chạm lần đầu rồi bật ra khỏi vùng)' : ''}`);
    if (o.valid && !gone) {                       // điểm giữa (50 %) của OB hợp lệ: mốc của tiêu chí cảnh báo

// 17/10/2026 (làm cho điện thoại): chỉ vẽ N ngày gần nhất (1/2/3/5/tất cả, nút ◀ ▶ dời cửa sổ), trục giá co theo các ngày đang xem,
// nến tự giãn vừa bề rộng (không còn khoảng trống riêng cho profile), profile mỗi ngày là lớp mờ ở mép phải ngày đó,
// mức VP/OB ghi thành thẻ ở mép phải khung, chạm nến → khung thông tin cố định (điện thoại không có rê chuột).
let TN = 2, TBACK = 0;                         // TN: số ngày xem (0 = tất cả); TBACK: lùi bao nhiêu ngày so với phiên cuối
try { const v = localStorage.getItem('cf_tn'); if (v != null && ['0', '1', '2', '3', '5'].includes(v)) TN = +v; } catch (e) {}
function tSetN(n) { TN = n; TBACK = 0; try { localStorage.setItem('cf_tn', String(n)); } catch (e) {} renderTick(); }
function tMove(k) { TBACK = Math.max(0, TBACK + k); renderTick(); }

// Xếp thẻ ở mép phải: giữ khoảng cách tối thiểu `gap`, kéo dây nối về đúng mức giá.
function edgeTags(svg, items, xL, w, yMin, yMax, gap = 12) {
  items.sort((a, b) => a.y - b.y);
  let prev = yMin - gap;
  items.forEach(it => { it.ty = Math.max(it.y, prev + gap); prev = it.ty; });
  let lim = yMax;
  for (let i = items.length - 1; i >= 0; i--) { items[i].ty = Math.min(items[i].ty, lim); lim = items[i].ty - gap; }
  items.forEach(it => {
    const c = css(it.c);
    if (it.y0 != null) el('rect', {x: xL - 3, y: it.y0, width: 3, height: Math.max(2, it.y1 - it.y0), fill: c, opacity: .8}, svg);
    if (Math.abs(it.ty - it.y) > 1.5) el('line', {x1: xL - 3, x2: xL, y1: it.y, y2: it.ty, stroke: c, 'stroke-width': 1}, svg);
    const g = el('g', {}, svg);
    el('rect', {x: xL, y: it.ty - 6.5, width: w, height: 13, rx: 3, fill: it.solid ? hexA(it.c, .18) : css('--card'), stroke: c, 'stroke-width': 1, 'stroke-dasharray': it.solid ? '2 1.5' : null}, g);
    el('text', {x: xL + w / 2, y: it.ty + 3.4, 'text-anchor': 'middle', style: `font-size:9.5px;font-weight:700;fill:${c}`}, g, it.txt);
    if (it.tip) tip(g, it.tip);
  });
}

function renderTick() {
  const t = D.sym[SYM].t, host = $('#tscroll');
  if (!t) { host.innerHTML = '<div class="sub" style="padding:20px">Mã này không có tick thật trong ' + D.meta.tick_days.length + ' phiên (hoặc thiếu chiều mua/bán).</div>'; $('#tprof').innerHTML = ''; $('#tleg').innerHTML = ''; $('#tinfo').innerHTML = ''; $('#tctl').style.display = 'none'; return; }
  $('#tctl').style.display = '';
  const nD = t.days.length, nShow = TN === 0 ? nD : Math.min(TN, nD);
  TBACK = Math.max(0, Math.min(TBACK, nD - nShow));
  const end = nD - 1 - TBACK, start = end - nShow + 1;
  document.querySelectorAll('#tctl [data-n]').forEach(b => b.classList.toggle('on', +b.dataset.n === TN));
  $('#tprev').disabled = start <= 0; $('#tnext').disabled = end >= nD - 1;
  $('#trange').textContent = nShow === 1 ? sh(t.days[end]) : sh(t.days[start]) + ' → ' + sh(t.days[end]);

  const narrow = host.closest('.chart').clientWidth < 640;
  $('#tprof').style.display = narrow ? 'none' : '';
  const vb = t.bars.filter(b => b[0] >= start && b[0] <= end);
  if (!vb.length) { host.innerHTML = '<div class="sub" style="padding:20px">Không có nến trong các ngày này.</div>'; return; }
  const showDp = $('#t_dp').checked, byD = {};
  vb.forEach((b, i) => (byD[b[0]] = byD[b[0]] || []).push(i));
  const slot = Math.max(...Object.values(byD).map(a => a.length)) + 1;          // mỗi ngày = số nến + 1 ô trống làm vạch ngăn
  const RM = narrow ? 108 : 92, PL = narrow ? 2 : 4, hostW = Math.max(240, host.clientWidth || 560);
  let pitch = Math.min(24, (hostW - 1 - RM - PL) / (nShow * slot)); if (pitch < 4) pitch = 4;   // < 4 px thì cho cuộn ngang
  const plotEnd = PL + nShow * slot * pitch, W = Math.ceil(plotEnd + RM), BW = pitch, cw = Math.max(2, Math.round(pitch * .72));
  const xs = new Array(vb.length), dayX = {};
  for (let d = start; d <= end; d++) {
    const x0 = PL + (d - start) * slot * pitch, ids = byD[d] || [];
    ids.forEach((i, k) => xs[i] = x0 + (k + .5) * pitch);
    dayX[d] = [x0, x0 + ids.length * pitch, x0 + slot * pitch];                  // [đầu, hết nến, hết ô ngày]
  }
  const top = 18, hP = 280, vTop = 332, vH = 70, cTop = 430, cH = 70, H = cTop + cH + 6;   // vTop/cTop dời xuống 16/34 px: chú thích nằm TRÊN khung, không đè đường
  let lo = Math.min(...vb.map(b => b[4])), hi = Math.max(...vb.map(b => b[3]));
  const pad = (hi - lo) * .06 || hi * .01; lo -= pad; hi += pad;
  const y = lin(hi, lo, top, top + hP);
  host.innerHTML = '';
  const svg = el('svg', {width: W, height: H}, host);
  ticks(lo, hi, 6).forEach(v => {
    el('line', {x1: 0, x2: plotEnd, y1: y(v), y2: y(v), stroke: css('--line')}, svg);
    if (narrow) el('text', {x: 2, y: y(v) - 2, class: 'lbl', style: halo()}, svg, fx(v));   // trục giá nằm trong khung (cột profile bị ẩn)
  });
  const cp = el('clipPath', {id: 'tc'}, svg); el('rect', {x: 0, y: top, width: W, height: hP}, cp);
  const gZ = el('g', {'clip-path': 'url(#tc)'}, svg);
  const edge = [], segLab = [];                                                 // edge: thẻ mép phải; segLab: chữ tên mức ở đầu đoạn của ngày cuối
  for (let di = start; di <= end; di++) {
    const [x0, x1, x2] = dayX[di], d = t.days[di];
    el('text', {x: x0 + 2, y: 11, class: 'lbl'}, svg, sh(d));
    el('line', {x1: x0, x2: x0, y1: top, y2: H - 4, stroke: css('--line'), 'stroke-dasharray': '2 3'}, svg);
    (t.zones[di] || []).forEach(z => {
      if (z.t === 'OB' && $('#t_ob').checked) {
        const up = z.role === 'buy', tk = up ? '--buy' : '--sell', col = css(tk), yt = y(z.hi), hh = Math.max(2, y(z.lo) - y(z.hi));
        const nm = `${up ? 'OB tăng' : 'OB giảm'}${z.valid ? ' ✓' : ''} ${fx(z.lo)}–${fx(z.hi)}`;
        const r = el('rect', {x: x0, y: yt, width: Math.max(2, x1 - x0), height: hh, fill: hexA(tk, z.valid ? .22 : .08), stroke: col, 'stroke-width': z.valid ? 2 : .8}, gZ);
        tip(r, nm + `${z.valid ? ' · HỢP LỆ' : ' · thường'}${z.P ? ' · chồng mức VP' : ''}`);
        if (di === end && z.valid) edge.push({y: (yt + y(z.lo)) / 2, y0: yt, y1: y(z.lo), c: tk, txt: `OB${up ? '↑' : '↓'} ✓`, tip: nm});
      } else if (z.t !== 'OB' && $('#t_vp').checked && !(z.t === 'POC' && z.role === 'sell')) {
        const c = css('--vp'), tt = `${z.t} ngày ({{VPW}} phiên, tới hôm trước) ${fx(z.lo)}${z.P ? ' · nằm trong/sát OB cùng phía' : ''}`;
        const ln = el('line', {x1: x0, x2: x1, y1: y(z.lo), y2: y(z.lo), stroke: c, 'stroke-width': z.t === 'POC' ? 1.8 : 1.1, 'stroke-dasharray': z.t === 'POC' ? null : '4 3', opacity: z.t === 'POC' ? .95 : .75}, gZ);
        tip(ln, tt);
        if (di === end) { edge.push({y: y(z.lo), c: '--vp', txt: `${z.t} {{VPW}}p ${fx(z.lo)}`, tip: tt}); segLab.push({y: y(z.lo), x: x0 + 2, txt: z.t}); }
      }
    });
    const dpd = t.dp[di];
    if (showDp && dpd) {                       // profile RIÊNG phiên này: lớp mờ bám mép phải ô ngày, nằm dưới nến
      const mx = Math.max(...dpd.v) || 1, bh = Math.max(2, Math.abs(y(dpd.p[0]) - y(dpd.p[1])) - .5), pw = Math.max(18, (x2 - x0) * .32);
      dpd.p.forEach((pp, k) => {
        const inVA = pp >= dpd.val && pp <= dpd.vah, isPoc = Math.abs(pp - dpd.poc) < (dpd.p[1] - dpd.p[0]) / 2 + 1e-9, w = Math.max(1, dpd.v[k] / mx * pw);
        const r = el('rect', {x: x2 - 1 - w, y: y(pp) - bh / 2, width: w, height: bh, fill: inVA || isPoc ? css('--vp') : css('--mut'), opacity: isPoc ? .6 : inVA ? .26 : .18}, svg);
        tip(r, `Phiên ${sh(d)} · giá ${fx(pp)} · KL ${big(dpd.v[k])}`);
      });
    }
    const yd = t.dp[di - 1];
    if ($('#t_yd').checked && di >= 1 && yd) {  // mức của phiên TRƯỚC kéo sang phiên này (số liệu ở khung thông tin)
      [['POC', yd.poc], ['VAH', yd.vah], ['VAL', yd.val]].forEach(([n, v]) => {
        const l2 = el('line', {x1: x0, x2: x1, y1: y(v), y2: y(v), stroke: css('--pv'), 'stroke-width': n === 'POC' ? 1.8 : 1.2, 'stroke-dasharray': '2 3'}, svg);
        tip(l2, `${n} phiên ${sh(t.days[di - 1])} (hôm qua) ${fx(v)}`);
      });
      if (di === end && yd.poc != null) edge.push({y: y(yd.poc), c: '--pv', txt: `Q ${fx(yd.poc)}`, tip: `POC phiên ${sh(t.days[di - 1])} (hôm qua) ${fx(yd.poc)}`});
    }
  }
  if ($('#t_cu').checked) {                     // cộng dồn từ phiên đầu tới hết mỗi ngày: đường bậc thang
    const dis = t.days.map((_, i) => i).filter(i => t.cp[i] && dayX[i]);
    [['poc', css('--cum'), 2, null], ['vah', css('--cum'), 1.2, '5 3'], ['val', css('--cum'), 1.2, '5 3']].forEach(([k, col, wd, da]) => {
      const pts = [];
      dis.forEach((i, j) => {
        const yy = y(t.cp[i][k]), a0 = dayX[i][0], a1 = dayX[i][1];
        pts.push([a0, yy], [a1, yy]);
        if (j < dis.length - 1) { const xm = (a1 + dayX[dis[j + 1]][0]) / 2, yn = y(t.cp[dis[j + 1]][k]); pts.push([xm, yy], [xm, yn]); }
      });
      const pl = el('polyline', {points: pts.map(q => q.join(',')).join(' '), fill: 'none', stroke: col, 'stroke-width': wd, 'stroke-dasharray': da}, svg);
      tip(pl, `${k.toUpperCase()} cộng dồn: ` + dis.map(i => `${sh(t.days[i])} ${fx(t.cp[i][k])}`).join(' → '));
    });
    const li = dis[dis.length - 1];
    if (li != null) edge.push({y: y(t.cp[li].poc), c: '--cum', txt: `CD ${fx(t.cp[li].poc)}`, tip: `POC cộng dồn ${fx(t.cp[li].poc)}`});
  }
  vb.forEach((b, i) => candle(svg, xs[i], cw, y, b[2], b[3], b[4], b[5]));
  { // tên mức (POC/VAH/VAL) ở đầu đoạn của ngày cuối; hai nhãn gần nhau thì đẩy cách ≥ 10 px
    let prev = -99; segLab.sort((a, b) => a.y - b.y);
    segLab.forEach(it => { it.ty = Math.max(it.y - 2, prev + 10); prev = it.ty; });
    segLab.forEach(it => { if (it.ty > top + 8 && it.ty < top + hP) el('text', {x: it.x, y: it.ty, style: halo() + `font-size:9.5px;font-weight:700;fill:${css('--vp')}`}, svg, it.txt); });
  }
  if ($('#t_vw').checked) {
    const byDay = {}; t.vwap.forEach(([di, m, v]) => (byDay[di] = byDay[di] || []).push([m, v]));
    const pts = {};
    vb.forEach((b, i) => {
      const arr = byDay[b[0]] || []; let v = null;
      for (const [m, vv] of arr) { if (m < b[1] + 15) v = vv; else break; }
      if (v != null) (pts[b[0]] = pts[b[0]] || []).push(xs[i] + ',' + y(v));
    });
    Object.values(pts).forEach(p => el('polyline', {points: p.join(' '), fill: 'none', stroke: css('--gold'), 'stroke-width': 1.5}, svg));
  }
  // vùng chạm + vạch chọn: vẽ TRƯỚC thẻ MUA/BÁN để thẻ nằm trên, nhưng thẻ cũng bấm được
  const hits = vb.map((b, i) => {
    const r = el('rect', {x: xs[i] - BW / 2, y: top, width: BW, height: H - top, fill: 'transparent', style: 'cursor:pointer'}, svg);
    const dl = b[6] - b[7];
    tip(r, `${sh(t.days[b[0]])} ${mm(b[1])}  O ${fx(b[2])} H ${fx(b[3])} L ${fx(b[4])} C ${fx(b[5])}\nMua CĐ ${big(b[6])} · Bán CĐ ${big(b[7])} · Delta ${big(dl)} (${((dl) / ((b[6] + b[7]) || 1) * 100).toFixed(0)}%)\nCá mập mua ${big(b[8])} · bán ${big(b[9])}`);
    r.addEventListener('click', () => select(i));
    return r;
  });
  const idx = {}; vb.forEach((b, i) => idx[b[0] + '|' + b[1]] = i);
  t.ev.forEach(e => {
    const i = idx[e.di + '|' + e.m]; if (i == null) return;
    const s = (e.P ? 1 : 0) + (e.F ? 1 : 0) + (e.K ? 1 : 0), b = vb[i], up = e.side === 'buy', sd = up ? 'MUA' : 'BÁN';
    const txt = `${up ? 'MUA' : 'BÁN'} ${s}/3 — Vị trí ${e.P ? '✓' : '✗'} · Dòng tiền ${e.F ? '✓' : '✗'} · Nến ${e.K ? '✓' : '✗'}\nVùng ${e.types.join('+')} ${fx(e.lo)}–${fx(e.hi)}${e.valid ? ' (OB hợp lệ)' : ''}\n${sh(t.days[e.di])} ${mm(e.m)}`;
    if (s >= 2 && $('#t_ev').checked) { const g = tag(svg, xs[i], up ? y(b[4]) : y(b[3]), up, s === 3 ? `${sd} 3/3 ★` : `${sd} 2/3`, s === 3, up, s === 3 ? 11.5 : 10, txt); g.addEventListener('click', () => select(i)); }
    else if (s < 2 && $('#t_dot').checked) { const c = el('circle', {cx: xs[i], cy: up ? y(b[4]) + 8 : y(b[3]) - 8, r: 3.2, fill: css('--dot'), stroke: '#000', 'stroke-width': .8}, svg); tip(c, txt); }
  });
  const vmx = Math.max(...vb.map(b => b[6] + b[7])) || 1, vy = lin(0, vmx, vTop + vH, vTop);
  vb.forEach((b, i) => {
    const base = vTop + vH, hw = Math.max(1, cw / 2);
    el('rect', {x: xs[i] - hw, y: vy(b[6]), width: hw, height: base - vy(b[6]), fill: css('--up'), opacity: .7}, svg);
    el('rect', {x: xs[i], y: vy(b[7]), width: hw, height: base - vy(b[7]), fill: css('--dn'), opacity: .7}, svg);
    const wl = b[8] - b[9];
    if (wl) el('line', {x1: xs[i] - hw, x2: xs[i] + hw, y1: vy(Math.min(Math.abs(wl), vmx)), y2: vy(Math.min(Math.abs(wl), vmx)), stroke: css('--gold'), 'stroke-width': 2}, svg);
  });
  const cd = [], cwh = []; let a = 0, w = 0, ld = -1;
  vb.forEach(b => { if (b[0] !== ld) { ld = b[0]; a = 0; w = 0; } a += b[6] - b[7]; w += b[8] - b[9]; cd.push(a); cwh.push(w); });
  const cm = Math.max(1, ...cd.map(Math.abs), ...cwh.map(Math.abs)), cy = lin(-cm, cm, cTop + cH, cTop);
  el('line', {x1: 0, x2: plotEnd, y1: cy(0), y2: cy(0), stroke: css('--line')}, svg);
  const seg = (arr, col) => { let cur = [], ldd = -1; const out = [];
    arr.forEach((v, i) => { if (vb[i][0] !== ldd) { if (cur.length) out.push(cur); cur = []; ldd = vb[i][0]; } cur.push(xs[i] + ',' + cy(v)); });
    if (cur.length) out.push(cur);
    out.forEach(p => el('polyline', {points: p.join(' '), fill: 'none', stroke: col, 'stroke-width': 1.6}, svg)); };
  seg(cd, css('--mut')); seg(cwh, css('--gold'));

  // mép phải: (điện thoại) profile gộp N phiên thành histogram mảnh + các thẻ mức giá
  let xTag = plotEnd + 4, wTag = RM - 6;
  if (narrow && t.vp) {
    const pr = t.vp, mx = Math.max(...pr.v) || 1, bh = Math.max(2, Math.abs(y(pr.p[0]) - y(pr.p[1])) - 1);
    pr.p.forEach((p, k) => {
      const inVA = p >= pr.val && p <= pr.vah, r = el('rect', {x: plotEnd + 2, y: y(p) - bh / 2, width: Math.max(1, pr.v[k] / mx * 16), height: bh, fill: inVA ? css('--vp') : css('--mut'), opacity: inVA ? .4 : .26}, svg);
      tip(r, `Gộp ${D.meta.tick_days.length} phiên · giá ${fx(p)} · KL ${big(pr.v[k])}`);
    });
    [['POC', pr.poc], ['VAH', pr.vah], ['VAL', pr.val]].forEach(([n, v]) => el('line', {x1: plotEnd + 2, x2: plotEnd + 20, y1: y(v), y2: y(v), stroke: css('--vp'), 'stroke-width': n === 'POC' ? 2 : 1, 'stroke-dasharray': n === 'POC' ? null : '3 2'}, svg));
    xTag = plotEnd + 24; wTag = RM - 26;
    // điện thoại không có cột profile gộp → ghi POC/VAH/VAL gộp thành thẻ nền tím nhạt viền chấm (khác thẻ "40p" nền trắng)
    [['POC', pr.poc], ['VAH', pr.vah], ['VAL', pr.val]].forEach(([n, v]) => { if (v != null) edge.push({y: y(v), c: '--vp', solid: 1, txt: `${n} gộp ${fx(v)}`, tip: `${n} profile gộp ${D.meta.tick_days.length} phiên tick ${fx(v)}`}); });
  }
  // mức nằm ngoài khung giá (khung co theo nến) vẫn hiện: ghim thẻ ở mép trên/dưới, thêm ▲/▼, bỏ dây nối/vạch OB
  edge.forEach(it => {
    const out = it.y < top ? '▲ ' : it.y > top + hP ? '▼ ' : '';
    if (!out) return;
    it.txt = out + it.txt; it.y = out === '▲ ' ? top + 7 + (it.y - top) * 1e-3 : top + hP - 7 + (it.y - top - hP) * 1e-3;   // giữ thứ tự theo giá khi xếp thẻ it.y0 = null; it.tip = (it.tip || '') + (out === '▲ ' ? ' · cao hơn khung giá đang xem' : ' · thấp hơn khung giá đang xem');
  });
  edgeTags(svg, edge, xTag, wTag, top + 7, top + hP - 7);

  const selR = el('rect', {x: 0, y: top, width: BW, height: H - top, fill: 'none', stroke: css('--ink'), 'stroke-width': 1.3, 'stroke-dasharray': '3 2', 'pointer-events': 'none'}, svg);
  function select(i) {
    const b = vb[i], d = b[0], dl = b[6] - b[7], day = t.days[d], zs = t.zones[d] || [], dpd = t.dp[d];
    selR.setAttribute('x', xs[i] - BW / 2);
    const lv = zs.filter(z => z.t !== 'OB' && !(z.t === 'POC' && z.role === 'sell')).map(z => `${z.t} ${fx(z.lo)}`).join(' · ');
    const ob = zs.filter(z => z.t === 'OB' && z.valid).map(z => `${z.role === 'buy' ? 'tăng' : 'giảm'} ${fx(z.lo)}–${fx(z.hi)}`).join(', ');
    const evs = t.ev.filter(e => e.di === d && e.m === b[1]).map(e => {
      const s = (e.P ? 1 : 0) + (e.F ? 1 : 0) + (e.K ? 1 : 0);
      return `<div><b class="tagc ${e.side === 'buy' ? 'buy' : 'sell'} ${s === 3 ? 'solid' : 'out'}">${e.side === 'buy' ? 'MUA' : 'BÁN'} ${s}/3</b> Vị trí ${e.P ? '✓' : '✗'} · Dòng tiền ${e.F ? '✓' : '✗'} · Nến ${e.K ? '✓' : '✗'} — vùng ${e.types.join('+')} ${fx(e.lo)}–${fx(e.hi)}${e.valid ? ' (OB hợp lệ)' : ''}</div>`;
    }).join('');
    $('#tinfo').innerHTML = `<div><b>${sh(day)} ${mm(b[1])}</b> · O ${fx(b[2])} · H ${fx(b[3])} · L ${fx(b[4])} · C <b>${fx(b[5])}</b></div>
      <div>Mua CĐ ${big(b[6])} · Bán CĐ ${big(b[7])} · Delta <b class="${dl >= 0 ? 'ok' : 'bad'}">${big(dl)}</b> (${(dl / ((b[6] + b[7]) || 1) * 100).toFixed(0)} %)</div>
      <div>Cá mập mua ${big(b[8])} · bán ${big(b[9])} · ròng <b class="${b[8] - b[9] >= 0 ? 'ok' : 'bad'}">${big(b[8] - b[9])}</b></div>
      <div class="sub">Mức ngày {{VPW}}p: ${lv || '—'}${ob ? ' · OB hợp lệ: ' + ob : ''}</div>
      ${dpd ? `<div class="sub">Profile riêng phiên ${sh(day)}: POC ${fx(dpd.poc)} · VAH ${fx(dpd.vah)} · VAL ${fx(dpd.val)}</div>` : ''}${evs}`;
  }
  select(vb.length - 1);
  $('#tcap').innerHTML = `<span style="top:${vTop - 15}px">KL chủ động 15' (xanh = mua, đỏ = bán) · vạch vàng = |delta cá mập|</span><span style="top:${cTop - 15}px">CVD phiên (xám = tổng, vàng = cá mập tổng hợp) · reset mỗi phiên</span>`;
  if (narrow) $('#tprof').innerHTML = ''; else profileCol($('#tprof'), t.vp, y, H, lo, hi, D.meta.tick_days.length + ' phiên gộp');
  host.scrollLeft = host.scrollWidth;   // cuộn về cuối SAU khi cột profile bên phải đã có chiều rộng
  window.__tw = host.clientWidth;
  $('#tleg').innerHTML = `<span><b class="tagc buy solid">MUA 3/3 ★</b> <b class="tagc sell solid">BÁN 3/3 ★</b> đủ Vị trí + Dòng tiền + Nến</span>
   <span><b class="tagc buy out">MUA 2/3</b> <b class="tagc sell out">BÁN 2/3</b> chỉ để theo dõi</span><span><i class="dot"></i>chạm vùng chưa đủ điểm (bật ô)</span>
   <span><i class="zb bv"></i>OB tăng ✓ · <i class="zb bn"></i>thường</span><span><i class="zb sv"></i>OB giảm ✓ · <i class="zb sn"></i>thường</span>
   <span><i class="ln" style="border-color:var(--vp)"></i>POC · <i class="ln" style="border-color:var(--vp);border-top-style:dashed"></i>VAH/VAL của {{VPW}} phiên tới hôm trước (đổi theo từng ngày) — chữ ở đầu đoạn và thẻ "{{VPW}}p" ở mép phải là mức của ngày cuối đang xem</span>
   <span><i class="ln" style="border-color:var(--gold)"></i>VWAP phiên</span>
   <span><i class="sw" style="background:var(--vp);opacity:.4"></i>lớp mờ ở mép phải mỗi ngày = profile riêng phiên đó (POC đậm hơn)</span>
   <span><i class="ln" style="border-color:var(--pv);border-top-style:dotted"></i>mức hôm qua (thẻ Q) · <i class="ln" style="border-color:var(--cum)"></i>cộng dồn từng ngày (thẻ CD)</span>
   <span>${narrow ? 'histogram mảnh ngoài cùng bên phải (thẻ nền tím viền chấm "gộp" = POC/VAH/VAL của nó)' : 'cột phải ngoài cùng'} = profile gộp ${D.meta.tick_days.length} phiên tick</span>
   <span><b>Chạm một nến</b> để xem chi tiết ở khung bên dưới</span>`;
}

/* ---------------------------------------------------------------- danh sách + tóm tắt */
// Điện thoại (≤ 860 px, 15/10/2026): danh sách chỉ hiện 5 mã đầu (+ mã đang xem), bấm "Xem đủ" để xổ ra; chọn mã xong tự thu gọn.
let SIDE_OPEN = false;
function renderSide() {
  const s = $('#side'); s.innerHTML = ''; s.classList.toggle('open', SIDE_OPEN);
  D.scan.forEach(r => {
    const row = document.createElement('div'); row.className = 'r' + (r.s === SYM ? ' on' : '');
    row.innerHTML = `<b>${r.s}</b><span class="sub">${fx(r.last)} <span class="${r.chg >= 0 ? 'ok' : 'bad'}">${pc(r.chg, 1)}</span></span><span>${r.valid ? `<span class="pill ob" title="OB hợp lệ còn sống">OB${r.valid}</span> ` : ''}<span class="pill ${r.score >= 3 ? 's3' : r.score == 2 ? 's2' : ''}" title="điểm hợp lưu cao nhất phiên cuối (★ = 3/3)">${r.tick ? (r.score >= 3 ? '★ ' : '') + r.score : '–'}</span></span>`;
    row.onclick = () => {
      SYM = r.s; location.hash = r.s;
      const wasOpen = SIDE_OPEN && matchMedia('(max-width:860px)').matches;

  <p><b>V — Vị trí.</b> Giá chạm vùng cầu/cung. Vùng cầu = OB tăng còn sống, POC, VAL; vùng cung = OB giảm, POC, VAH (profile {{VPW}} phiên tới hôm trước). <b>P = 1</b> khi OB chồng mức VP (dung sai 0,25 ATR) hoặc mức VP nằm trong/sát OB cùng phía — "vùng được hai nguồn xác nhận".</p>
  <p><b>F — Dòng tiền.</b> Mua: delta nến 15' ≥ +20 % KL, hoặc giá chạm đáy phiên mà CVD cá mập phiên còn dương. Bán: hấp thụ mua (delta ≥ +30 % nhưng đóng nửa dưới nến) hoặc giá chạm đỉnh phiên mà CVD cá mập âm. Cá mập = lệnh ≥ 500 tr + cá mập ẩn của app price-path.</p>
  <p><b>K — Kích hoạt.</b> Mua: nến xanh đóng cửa ≥ đáy vùng sau khi bóng chạm vùng. Bán: nến đỏ đóng cửa ≤ đỉnh vùng sau khi bóng chạm vùng.</p>
  <p>Điểm 0–3, trọng số bằng nhau (không tối ưu). Thẻ chỉ hiện từ 2/3; thẻ <b>đặc có ★</b> = 3/3 = mức "cảnh báo". (Điều này áp dụng cho thẻ 15'. Thẻ NGÀY dùng tiêu chí riêng bên dưới.)</p>
  <p><b>Cảnh báo trên thẻ NGÀY — 4 tiêu chí BẮT BUỘC cùng lúc (MUA; BÁN đối xứng) + dấu ★ tím:</b></p>
  <p>① <b>OB hợp lệ còn sống</b>: OB tăng đạt V1+V2+V3 (nến xác nhận KL ≥ {{VOLX}}× TB20 đóng trong 10 % trên cùng, có FVG ≥ 1 ATR hợp lưu, vùng ≤ 1,5 ATR), ≤ 60 phiên, chưa đóng cửa thủng đáy.<br>
  ② <b>Phiên test</b> = lần giá quay lại chạm vùng ĐẦU TIÊN (sau khi đã rời hẳn lên trên, và sau phiên ★ + 3). Lần chạm đầu bị dùng hết dù đạt hay không.<br>
  ③ <b>Chỉ vào nửa trên vùng</b>: điểm giữa ≤ Low ≤ đỉnh OB (râu không xuống quá đường "50 %") và đóng cửa ≥ điểm giữa. (BÁN: đáy OB ≤ High ≤ giữa, đóng cửa ≤ giữa.)<br>
  ④ <b>POC trong dải giữa OB</b>: POC của profile ngày {{VPW}} phiên (tính đến hôm trước phiên test, đường tím) nằm trong 25–75 % chiều cao OB (dải tô đậm trong hộp OB hợp lệ).</p>
  <p><b>Dấu ★ tím</b> (không bắt buộc): gắn thêm lên thẻ khi có <b>1 trong 2 hoặc cả 2</b> điều kiện dòng tiền của phiên test — ⑤ delta ngày &gt; 0 (BÁN: &lt; 0); ⑥ CVD (mua−bán chủ động cộng dồn từ nến 5' khớp liên tục) chạm đáy ≤ −15 % KL phiên trước 11:30 (BÁN: đỉnh ≥ +15 % KL). Không có ★ vẫn là cảnh báo; thiếu dữ liệu (delta ngày thật chỉ có từ 18/09, CVD trong phiên từ 30/09/2026) thì không ★.</p>
  <p>Thẻ <b>đặc</b> = đủ ①②③④. Thẻ <b>viền rỗng</b> (bật ô "cả lần test thiếu POC") = lần test OB hợp lệ qua ③ nhưng POC ngoài dải giữa. Thẻ ngày không dùng TB20 hay nến xác nhận.</p>
  <p><b>Các bộ mức Volume Profile trên thẻ 15' (khác nhau nên đọc kỹ):</b></p>
  <p>① <b>Profile ngày {{VPW}} phiên</b> — các đường tím (POC liền, VAH/VAL đứt) chạy ngang khung nến, dựng từ nến ngày tới hôm trước, giống nhau mọi phiên. ② <b>Profile từng phiên</b> — histogram nhỏ ở mép phải mỗi cụm nến, dựng từ nến 5' của chính phiên đó (tick thật). ③ <b>Mức hôm qua</b> — POC/VAH/VAL của phiên trước, kéo sang phiên kế tiếp (xám chấm). ④ <b>Cộng dồn</b> — profile tick gộp từ phiên đầu tới hết mỗi ngày, vẽ thành bậc thang (xanh ngọc); ngày cuối trùng cột phải ngoài cùng.</p>
  <h3>Bảng ký hiệu và màu sắc</h3>
  <p>Nguyên tắc: <b>màu nến</b> (xanh lá = tăng, đỏ = giảm) chỉ dành cho nến, khối lượng, delta. <b>Vùng và tín hiệu</b> dùng cặp màu khác hẳn: <b class="tagc buy solid">xanh dương = CẦU / MUA</b> <b class="tagc sell solid">cam = CUNG / BÁN</b>. Tím = Volume Profile. Vàng = VWAP / cá mập.</p>
  <table class="symt">
   <tr><td><i class="zb bv"></i><i class="zb bn"></i></td><td>OB tăng (vùng cầu): nến đỏ ngay trước nhịp đẩy lên mạnh. Ô <b>đậm, viền dày, nhãn ✓</b> = hợp lệ (nến xác nhận KL ≥ {{VOLX}}× TB20, có FVG ≥ 1 ATR, vùng hẹp ≤ 1,5 ATR); ô nhạt, viền mỏng = thường.</td></tr>
   <tr><td><i class="zb sv"></i><i class="zb sn"></i></td><td>OB giảm (vùng cung): nến xanh ngay trước nhịp đẩy xuống mạnh; cách đọc đậm/nhạt như trên.</td></tr>
   <tr><td><i class="zb bn"></i></td><td><b>OB bình thường có imbalance</b>: nến k đỏ rồi xanh, có BOS, đẩy ≥ 1,5 ATR trong ≤ 3 phiên, <b>và</b> nhịp đẩy (nến k … m+2) để lại imbalance — FVG (khoảng trống giữa bóng nến 1 và bóng nến 3, mọi cỡ) hoặc Volume Imbalance (thân nến sau nằm hẳn trên thân nến trước nhưng bóng vẫn chồng; OB giảm đối xứng). Tooltip hộp OB ghi loại imbalance. OB hợp lệ luôn nằm trong nhóm này.</td></tr>
   <tr><td><i class="zb br"></i></td><td>OB đã thủng (giá đóng cửa xuyên qua vùng): ẩn mặc định, bật ô "Hiện OB đã thủng / đã dùng" để xem lại.</td></tr>
   <tr><td><i class="zb br"></i></td><td><b>OB chỉ dùng một lần</b>: sau lần chạm đầu tiên, phiên đầu tiên giá bật hẳn ra khỏi vùng (OB tăng: Low &gt; đỉnh vùng; OB giảm: High &lt; đáy vùng) thì OB đã dùng — ẩn như OB thủng, các lần quay lại test sau bỏ qua, vùng cũng không còn xuất hiện ở thẻ 15'. Giá nằm lại trong vùng nhiều phiên thì OB vẫn còn sống.</td></tr>
   <tr><td><b class="tagc buy solid">MUA</b> <b class="tagc sell solid">BÁN</b></td><td>Thẻ ngày: CẢNH BÁO — đủ 4 tiêu chí bắt buộc ①②③④ (OB hợp lệ, lần test đầu, chỉ vào nửa OB, POC trong dải giữa).</td></tr>
   <tr><td><b class="tagc buy solid">MUA</b><b class="starb">★</b></td><td>Thẻ ngày: cảnh báo có thêm dòng tiền — delta ngày đúng dấu và/hoặc CVD nửa đầu phiên ≥ 15 % KL ngược chiều (tooltip ghi từng cái).</td></tr>
   <tr><td><b class="tagc buy out">MUA</b> <b class="tagc sell out">BÁN</b></td><td>Thẻ ngày: lần test OB hợp lệ qua điều kiện ③ nhưng POC ngoài dải giữa (chỉ hiện khi bật ô "cả lần test thiếu POC"); rê chuột để xem lý do.</td></tr>
   <tr><td><i class="ln" style="border-color:var(--buy);border-top-style:dashed"></i> <i class="ln" style="border-color:var(--sell);border-top-style:dashed"></i></td><td>Đường "50 %" trong OB hợp lệ còn sống: mốc điểm giữa của tiêu chí cảnh báo.</td></tr>
   <tr><td><b class="tagc buy solid">MUA 3/3 ★</b> <b class="tagc sell solid">BÁN 3/3 ★</b></td><td>Thẻ 15': đủ ba điều kiện Vị trí + Dòng tiền + Nến — mức cảnh báo cao nhất.</td></tr>
   <tr><td><b class="tagc buy out">MUA 2/3</b> <b class="tagc sell out">BÁN 2/3</b></td><td>Thẻ 15': đủ hai điều kiện, chỉ để theo dõi.</td></tr>
   <tr><td><i class="dot"></i></td><td>Chấm cam viền đen: giá chạm vùng nhưng chưa đủ 2/3 điểm (bật ô "mọi lần chạm vùng").</td></tr>
   <tr><td><i class="ln" style="border-color:var(--vp)"></i> <i class="ln" style="border-color:var(--vp);border-top-style:dashed"></i></td><td>POC (liền) và VAH/VAL (đứt) của Volume Profile — màu tím.</td></tr>
   <tr><td><i class="ln" style="border-color:var(--gold)"></i></td><td>VWAP phiên (vàng); vạch vàng ở khung KL/Delta = delta cá mập.</td></tr>
   <tr><td><i class="ln" style="border-color:var(--wl)"></i></td><td>Khung CVD ngày: đường tím = CVD cá mập (cộng dồn từ 18/09, cùng thang với CVD tổng) = delta lệnh lớn ≥ 500 tr + cá mập ẩn. Cá mập ẩn chỉ có từ phiên 25/09 và 30/09, các phiên khác chỉ có lệnh lớn (tooltip từng chấm ghi rõ). Đường vàng = CVD tổng mọi lệnh (chưa tách cá mập).</td></tr>
  </table>
  <div class="note">Đây là bản nghiên cứu, chưa phải tín hiệu giao dịch: các lab trước đo từng chỉ báo riêng đều không qua cổng, xem tab "Kết quả đo".</div></div>`;
}

// ---------------------------------------------------------------- cài app (khuôn kiem-mua/docs/app.js, 27/09/2026)
// Chrome/Android bắn beforeinstallprompt khi trang đủ điều kiện cài → giữ lại, hiện nút vàng, bấm thì mở hộp cài thật.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
{
  let deferred = null;
  const installed = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ui = () => {
    const st = $('#installState');
    if (installed()) { $('#installTop').hidden = true; $('#installBtn').hidden = true; st.textContent = 'Đã cài: đang mở Confluence như một app.'; return; }
    $('#installTop').hidden = !deferred; $('#installBtn').hidden = !deferred;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    st.innerHTML = deferred ? 'Bấm nút bên dưới (hoặc nút vàng ở đầu trang), rồi chọn <b>Cài đặt</b>.'
      : ios ? 'Trên iPhone: mở bằng Safari → nút <b>Chia sẻ</b> → <b>Thêm vào MH chính</b>.'
      : 'Chưa thấy nút cài? Mở bằng <b>Chrome</b>, tải lại trang một lần, đợi vài giây. Hoặc bấm <b>⋮</b> → <b>Cài đặt ứng dụng</b> (hoặc <b>Thêm vào màn hình chính</b>). Đã lỡ tạo lối tắt thì xoá lối tắt đó trước.';
  };
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; ui(); });
  addEventListener('appinstalled', () => { deferred = null; ui(); });
  const doInstall = async () => {
    if (!deferred) return ui();
    deferred.prompt();
    await deferred.userChoice.catch(() => null);
    deferred = null;
    ui();
  };
  $('#installTop').onclick = doInstall;
  $('#installBtn').onclick = doInstall;
  ui();
}
</script>
